# Example configuration using JAX/SBX backend instead of PyTorch/SB3.
#
# To use this config, install the JAX extras:
#   pip install nett-benchmarks[jax]       # for GPU (CUDA 12)
#   pip install nett-benchmarks[jax-cpu]   # for CPU-only
#
# SBX supports a subset of SB3 algorithms (PPO, SAC, TD3, DQN, TQC, DroQ, CrossQ).
# Custom PyTorch encoders (e.g. ViT, ResNet) are not available in JAX mode;
# SBX uses its own internal CNN/MLP architectures based on the policy string.

name: Experiment1_JAX
use_jax: true
episodes:
  train: 5000
  test: 20
steps_per_episode: 200
num_brains: 5
task_memory: auto
brain:
  policy: CnnPolicy
  algorithm: PPO
  reward: closeness
  batch_size: 512
  buffer_size: 2048
  learning_rate: 0.0003
  custom_policy_arch:
    - 64
    - 32
body:
  wrappers: []
  record_eps:
    train: 0
    test: 0
environment:
  executable_path: path/to/executable.x86_64
  conditions:
    - object1
    - object2
  record_eps:
    train: 0
    test: 0
  multiagent: false
  display: 0

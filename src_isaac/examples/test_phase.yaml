# Fast train+test config to verify train→test runs end-to-end through at
# least one PPO update.
#
# Scope: 2 brains, 1 imprint condition (Object1), 2 train episodes, 1 test
# episode each across 2 test conditions. Train collects 100 timesteps per
# agent (above the conservative rollouts floor of 64 set by
# `_apply_algorithm_stability_defaults`), so PPO does at least one full
# update — exercising the path where RandomMemory's size must equal
# `cfg.rollouts` to avoid sampling unfilled NaN rows.
name: test_phase

environment:
  design_sheet: /home/zach/Code/NewbornEmbodiedTuringTest_Private/isaac_lab/assets/design_sheets/binding_minimal.csv
  media_root: /home/zach/Code/NewbornEmbodiedTuringTest_Private/isaac_lab/assets/videos
  conditions: [Object1]
  headless: true
  binocular_vision: true
  input_resolution: 64
  reward_types: [closeness]

brain:
  algorithm: PPO
  encoder: small
  batch_size: 32
  buffer_size: 64
  learning_rate: 1.0e-5
  train_encoder: true
  wandb:
    mode: disabled                  # smoke runs don't touch wandb cloud

num_brains: 2
episodes:
  train: 2
  test: 1
steps_per_episode: 50
task_memory: 4                     # GB; explicit so test_phase skips the dry-run estimator

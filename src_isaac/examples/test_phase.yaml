# Fast train+test config to verify train→test runs end-to-end through at
# least one PPO update.
#
# Scope: 2 brains, 1 imprint condition (Object1), 2 train episodes, 1 test
# episode each across 2 test conditions. Train collects at least one full
# 64-step rollout per agent, so PPO does at least one update — exercising the
# path where RandomMemory's size must equal `cfg.rollouts` to avoid sampling
# unfilled NaN rows.
name: test_phase

environment:
  design_sheet: /home/zach/Code/NewbornEmbodiedTuringTest_Private/isaac_lab/assets/design_sheets/binding_minimal.csv
  media_root: /home/zach/Code/NewbornEmbodiedTuringTest_Private/isaac_lab/assets/videos
  conditions: [Object1]
  headless: true
  input_resolution: 64
  reward_types: [closeness]

brain:
  algorithm: PPO
  encoder: small
  encoder_cfg:
    trainable: true
  algorithm_cfg:
    learning_rate: 1.0e-5
    rollouts: 64
    mini_batches: 2
  wandb:
    mode: disabled                  # smoke runs don't touch wandb cloud

num_brains: 2
episodes:
  train: 2
  test: 1
steps_per_episode: 50
task_memory: 4                     # GB; explicit so test_phase skips the dry-run estimator

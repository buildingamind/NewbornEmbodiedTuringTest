[build-system]
requires = ["setuptools", "pip"]
build-backend = "setuptools.build_meta"

[project]
name = "nett-skrl"
dynamic = ["version"]
authors = [
  { name="Zachary Laborde", email="zlaborde@iu.edu" },
]
description = "NETT benchmark — Isaac Lab + skrl backend (sibling of nett-benchmarks)."
readme = "README.md"
license = {text = "MIT"}
requires-python = "==3.11.*"
# Repo layout assumed: this public repo is PROJECT_ROOT, and the Isaac Lab sim
# package lives beside it at ../NewbornEmbodiedTuringTest_Private/isaac_lab/.
# The legacy nett-benchmarks package is intentionally not a hard dependency:
# its SB3/ML-Agents pins conflict with Isaac Lab, and analysis imports are lazy.
# If the checkout layout differs, override these path-deps in your own
# constraints file or install the deps manually before `pip install -e .`.
dependencies = [
    # "nett-isaac @ file:///${PROJECT_ROOT}/../NewbornEmbodiedTuringTest_Private/isaac_lab",
    "isaaclab",
    "skrl>=2.0.0",
    "nvidia-ml-py",
    "opencv-python-headless",
    # LOAD-BEARING PIN — without it EVERY GPU conv2d dies and no CNN trains at all:
    #   RuntimeError: CUDNN_BACKEND_TENSOR_DESCRIPTOR cudnnFinalize failed ...
    #   cudnn_status: CUDNN_STATUS_SUBLIBRARY_VERSION_MISMATCH   (bare conv2d, no Isaac)
    # torch 2.12+cu130 pulls nvidia-cudnn-cu13 9.20.0.48, which ships only 8 libs and NO
    # libcudnn_engines_tensor_ir.so.9 -- yet its libcudnn.so.9 dlopens that sublib at
    # runtime, so the loader falls through to the SYSTEM cudnn (9.23.1 here) and the
    # versions mismatch. 9.23.x ships tensor_ir, so every lib resolves from one wheel.
    # Verified 2026-07-15: conv2d OK with LD_LIBRARY_PATH unset, torch reports cudnn 92302.
    # Do NOT let nvidia-cudnn-cu12 back in alongside it: both wheels claim the SAME 8 .so
    # paths, so uninstalling either deletes them out from under the other (reinstall after).
    "nvidia-cudnn-cu13>=9.23; platform_system=='Linux'",
    # `reinit="create_new"` (used in brain.py to keep multiple per-brain
    # wandb runs alive in the same worker process) was added in wandb 0.17.
    "wandb>=0.17",
    "jsonschema",
    "pyyaml",
    "tqdm",
    # Runtime, not test-only: analysis/api.py reads tfevents through
    # tensorboard.backend.event_processing to recover per-run reward curves, and the optuna
    # tuner picks trials off those same event files. A run that trains fine but cannot be
    # analysed is not a working install.
    "tensorboard",
]

[project.optional-dependencies]
notebook = ["ipywidgets"]
# What the SUITE needs and the package does not. Undeclared, these look like a broken
# checkout rather than a missing install: `psutil` is imported at module scope by
# tests/fault_injection.py, which tests/conftest.py imports, so a venv without it fails
# COLLECTION -- every test errors out with `ModuleNotFoundError: No module named 'psutil'`
# and nothing points at the real cause. Install with `pip install -e '.[test]'`.
# `tensorboard` is deliberately NOT here: the analysis path needs it at runtime, so it is a
# main dependency. `optuna` also stays out: tests/test_optuna_tune.py `importorskip`s it,
# and it is a tuning-only dependency. Note its ONE skip line stands for 22 tests.
# `pytest-xdist` is what makes the e2e tree bearable: every test in it is a real training
# run, so `-n <gpus>` (one worker per GPU, assigned in tests/e2e/conftest.py) turns ~17
# serial minutes into tests/GPUs rounds. The pre-push hook uses it automatically.
test = ["pytest", "psutil", "pytest-xdist"]

[project.scripts]
# `pip install -e .` then `nett-skrl --config path/to.yaml`
nett-skrl = "nett_skrl.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "nett_skrl._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["nett_skrl*"]

[tool.setuptools.package-data]
nett_skrl = ["schema.json"]

[tool.pytest.ini_options]
# Default run excludes the Isaac-Sim-dependent tests so the fast unit suite
# stays runnable on machines without GPU/Isaac. Opt in with
# ``pytest -m e2e_isaac`` or ``-m e2e_perf``.
addopts = "-m 'not e2e_isaac and not e2e_perf'"
markers = [
    "e2e_isaac: end-to-end test requiring GPU + Isaac Sim",
    "e2e_perf: performance/convergence test that reads/writes golden.json",
]
